name: Test, security checks and Pages deployment

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents fragment_grow cli.py enrichment.py simulator.py tests
      - name: Run tests
        run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]" pip-audit
      - name: Scan installed dependencies for known vulnerabilities
        run: python -m pip_audit

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t fragmentgrow:ci .
      - name: Test container health endpoint
        run: |
          docker run -d --name fragmentgrow-smoke -p 127.0.0.1:18080:8000 fragmentgrow:ci
          trap 'docker rm -f fragmentgrow-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/health

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, dependency-audit, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Publish static browser interface
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, dependency-audit, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create v2.0.1 release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.1 already published"
            exit 0
          fi
          gh release create v2.0.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v2.0.1" --notes-file RELEASE_NOTES.md
