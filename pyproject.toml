[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fragment-based-growing-engine"
version = "2.0.0"
description = "FragmentGrow: Fragment-Based Drug Discovery (FBDD) Linking & Growing Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
fragment-based-growing-engine = "fragment_grow.cli:main"
fragment-based-growing-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "fragment_grow_app"]

[tool.setuptools.packages.find]
include = ["agents*", "fragment_grow*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fragment-based-growing-agent"
Repository = "https://github.com/abusuraihsakhri/fragment-based-growing-agent.git"
