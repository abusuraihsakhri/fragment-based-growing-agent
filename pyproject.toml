[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fragment-based-growing-engine"
version = "2.0.0"
description = "FragmentGrow: Fragment-Based Drug Discovery (FBDD) Linking & Growing Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fragment-based-growing-engine = "fragment_grow.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fragment-based-growing-engine"
Repository = "https://github.com/abusuraihsakhri/fragment-based-growing-engine.git"
